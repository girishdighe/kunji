name: verify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: kunji-ci
    steps:
      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Show Node.js version
        run: node --version

      - name: Run full verification suite
        run: npm run verify

  deploy:
    needs: verify
    if: ${{ forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/main' }}
    runs-on: kunji-ci
    timeout-minutes: 30
    steps:
      - name: Deploy tested commit to Fluidprism
        env:
          KUNJI_DEPLOY_PRIVATE_KEY_B64: ${{ secrets.KUNJI_DEPLOY_PRIVATE_KEY_B64 }}
          KUNJI_DEPLOY_KNOWN_HOSTS: ${{ secrets.KUNJI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s' "$KUNJI_DEPLOY_PRIVATE_KEY_B64" \
            | base64 --decode > "$HOME/.ssh/kunji-deploy"
          printf '%s\n' "$KUNJI_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh \
            -i "$HOME/.ssh/kunji-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            girish@100.123.238.27 \
            "deploy $FORGEJO_SHA"
